[project]
name = "tender-intelligence"
version = "0.1.0"
description = "AI-assisted tender analysis and bid decision support for construction projects"
requires-python = ">=3.12"

dependencies = [
  # API
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "python-multipart>=0.0.12",

  # Database
  "sqlalchemy>=2.0.36",
  "psycopg[binary]>=3.2",
  "pgvector>=0.3.6",
  "alembic>=1.14",

  # Queue and cache
  "celery[redis]>=5.4",
  "redis>=5.2",

  # Object storage
  "boto3>=1.35",

  # Document processing
  "docling>=2.14",
  "pdfplumber>=0.11",
  "pymupdf>=1.24",
  "pytesseract>=0.3.13",
  "pillow>=11.0",
  "openpyxl>=3.1",

  # Model providers (HTTP only; nothing runs locally)
  "httpx>=0.28",
  "tenacity>=9.0",

  # Decision agent
  "langgraph>=0.2.50",

  # Similarity
  "datasketch>=1.6",
  "rapidfuzz>=3.10",
  "numpy>=2.1",

  # Auth
  "python-jose[cryptography]>=3.3",

  # Observability
  "structlog>=24.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
  "ruff>=0.8",
  "mypy>=1.13",
  "types-requests",
  "respx>=0.22",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["B008"]  # FastAPI Depends() in defaults is the documented pattern

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
