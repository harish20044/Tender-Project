name: tender-intelligence

services:
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env
    ports:
      - "8000:8000"
    environment:
      # The repository layout the default infers from does not exist here, so
      # the data directory is named explicitly and mounted below.
      DATA_DIR: /app/data
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      # Scraped listings, shared with the host so a scrape run either side is
      # visible to the other.
      - ./data:/app/data
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env
    environment:
      DATA_DIR: /app/data
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./data:/app/data
    # Ingestion is IO- and CPU-bound with long tasks, so prefork with a small
    # concurrency beats a high thread count here. -B runs the beat scheduler
    # embedded in this same process (fine for one worker container; running
    # more than one replica would double-schedule and needs a separate beat
    # service instead). NOTE: this image has no Chrome and no `scraper` extra
    # installed, so AUTO_DOWNLOAD_DOCUMENTS only actually works when the
    # worker runs on the host (RUNNING.md's no-Docker route) — enabling it
    # here would just fail every download task.
    command: celery -A app.workers.celery_app worker --loglevel=INFO --concurrency=2 -B

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    env_file: .env
    environment:
      # Inside the network the API is another container, so localhost would
      # resolve to this one.
      VITE_PROXY_TARGET: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0

volumes:
  redis-data:
